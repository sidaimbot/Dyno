name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require the tag to match package.json
        run: node -e "const v=require('./package.json').version; const t=process.env.GITHUB_REF_NAME.replace(/^v/,''); if(v!==t){ console.error('Tag v'+t+' does not match package.json '+v); process.exit(1); }"

      - name: Install npm dependencies
        run: npm install

      - name: Build the bundled media helper
        run: |
          py -m pip install --upgrade pip
          py -m pip install winsdk pyinstaller
          npm run build:helper

      - name: Delete existing release (if any)
        run: |
          gh release delete v${{ package.json.version }} --yes 2>/dev/null || true

      - name: Build the NSIS installer and publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_GITHUB_OWNER: ${{ github.repository_owner }}
          UPDATE_GITHUB_REPO: ${{ github.event.repository.name }}
        run: npx electron-builder --win nsis --x64 --publish always

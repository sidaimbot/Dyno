<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings</title><link rel="stylesheet" href="settings.css"></head><body><main><header><div class="eyebrow">DYNO</div><h1>Settings</h1><p>Personalize your desktop island.</p></header><section><h2>Features</h2><div id="features"></div></section><section><h2>Appearance</h2><label>Position<select id="position"><option value="top-center">Top center</option></select></label><label>Top offset <input id="offsetY" type="number" min="0" max="120" value="8"></label><label>Animation speed <input id="animationSpeed" type="range" min=".5" max="1.8" step=".1" value="1"><span id="speedValue">1×</span></label></section><section><h2>Startup</h2><label class="toggle"><input id="startWithWindows" type="checkbox"> Start with Windows</label><p class="hint">Starts the island when you sign in to Windows.</p></section><footer><span id="status">Changes save automatically.</span><button id="close">Done</button></footer></main><script src="settings.js"></script></body></html>
